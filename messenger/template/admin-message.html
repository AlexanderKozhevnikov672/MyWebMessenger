<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Messages</title>
</head>
<body>

<div class="container">
    <button onclick="window.location.href='/admin/user'">
        User
    </button>
    <button onclick="window.location.href='/admin/friendship'">
        Friendship
    </button>
    <button onclick="window.location.href='/admin/friendship-invitation'">
        Friendship Invitation
    </button>
    <button onclick="window.location.href='/admin/chat'">
        Chat
    </button>
    <button onclick="window.location.href='/admin/chat-membership'">
        Chat Membership
    </button>
    <button onclick="window.location.href='/admin/chat-invitation'">
        Chat Invitation
    </button>
    <button onclick="window.location.href='/admin/message'">
        Message
    </button>
    
    <h1>Admin Panel - Message Management</h1>

    <table class="message-table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Chat Id</th>
            <th>User Id</th>
            <th>Text</th>
            <th>Delete Message</th>
        </tr>
        </thead>
        <tbody>
        {{range .Messages}}
        <tr>
            <td>{{.Id}}</td>
            <td>{{.ChatId}}</td>
            <td>{{.UserId}}</td>
            <td>{{.MsgText}}</td>
            <td class="delete">
                <button onclick="deleteMessage({{.Id}})">Delete</button>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>


<script>
    function deleteMessage(id) {
        if (confirm(`Are you sure you want to delete message ${id}?`)) {
            fetch(`/admin/message/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert(`Message ${id} deleted successfully`);
                    location.reload();
                } else {
                    alert(`Failed to delete message ${id}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(`An error occurred while deleting message ${id}`);
            });
        }
    }
</script>

</body>
</html>
