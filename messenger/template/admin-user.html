<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Users</title>
</head>
<body>

<div class="container">
    <button onclick="window.location.href='/admin/user'">
        User
    </button>
    <button onclick="window.location.href='/admin/friendship'">
        Friendship
    </button>
    <button onclick="window.location.href='/admin/friendship-invitation'">
        Friendship Invitation
    </button>
    <button onclick="window.location.href='/admin/chat'">
        Chat
    </button>
    <button onclick="window.location.href='/admin/chat-membership'">
        Chat Membership
    </button>
    <button onclick="window.location.href='/admin/chat-invitation'">
        Chat Invitation
    </button>
    <button onclick="window.location.href='/admin/message'">
        Message
    </button>

    <h1>Admin Panel - User Management</h1>

    <form id="newUserForm">
        <label for="nickname">Nickname:</label>
        <input type="text" id="nickname" name="nickname" required><br><br>

        <label for="password">Password:</label>
        <input type="text" id="password" name="password" required><br><br>

        <button type="button" id="createNewUser">Create User</button>
    </form>

    <table class="user-table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nickname</th>
            <th>Password Hash</th>
            <th>New Nickname</th>
            <th>New Password</th>
            <th>Delete User</th>
        </tr>
        </thead>
        <tbody>
        {{range .Users}}
        <tr>
            <td>{{.Id}}</td>
            <td>{{.Nickname}}</td>
            <td>{{.PasswordHash}}</td>
            <td class="changeNickname">
                <form id="changeNicknameForm{{.Id}}">
                    <input type="text" id="newNickname" name="new_nickname" required>
            
                    <button type="button" id="changeNickname{{.Id}}">Change</button>
                </form>
            </td>
            <td class="changePassword">
                <form id="changePasswordForm{{.Id}}">
                    <input type="text" id="newPassword" name="new_password" required>
            
                    <button type="button" id="changePassword{{.Id}}">Change</button>
                </form>
            </td>
            <td class="delete">
                <button onclick="deleteUser({{.Id}})">Delete</button>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>


<script>
    function getFormDataAsJSON(formId) {
        const form = document.getElementById(formId);
        if (!form) {
            console.error(`Form with ID "${formId}" not found.`);
            return null;
        }

        const formData = new FormData(form);
        const formJSON = {};

        formData.forEach((value, key) => {
            formJSON[key] = value;
        });

        document.getElementById(formId).reset();

        return formJSON;
    }

    function sendJSON(endpoint, json) {
        fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(json)
        })
        .then(response => {            
            if (response.ok) {
                alert("JSON sent successfully!");
                location.reload()
            } else {
                return response.json().then(data => {
                    alert("Error: " + (data["error"] || "server troubles"));
                });
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while sending json.");
        });
    }

    document.getElementById("createNewUser").addEventListener("click", function(event) {
        event.preventDefault();
        
        const json = getFormDataAsJSON("newUserForm");
        sendJSON("/admin/user/create", json);
    });

    {{range .Users}}
        document.getElementById("changeNickname{{.Id}}").addEventListener("click", function(event) {
            event.preventDefault();

            const json = getFormDataAsJSON("changeNicknameForm{{.Id}}");
            json["id"] = {{.Id}};
            
            sendJSON("/admin/user/change", json);
        });

        document.getElementById("changePassword{{.Id}}").addEventListener("click", function(event) {
            event.preventDefault();

            const json = getFormDataAsJSON("changePasswordForm{{.Id}}");
            json["id"] = {{.Id}};
            
            sendJSON("/admin/user/change", json);
        });
    {{end}}

    function deleteUser(id) {
        if (confirm(`Are you sure you want to delete user ${id}?`)) {
            fetch(`/admin/user/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert(`User ${id} deleted successfully`);
                    location.reload();
                } else {
                    alert(`Failed to delete user ${id}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(`An error occurred while deleting user ${id}`);
            });
        }
    }
</script>

</body>
</html>
