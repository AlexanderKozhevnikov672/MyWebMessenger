<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Chats</title>
</head>
<body>

<div class="container">
    <button onclick="window.location.href='/admin/user'">
        User
    </button>
    <button onclick="window.location.href='/admin/friendship'">
        Friendship
    </button>
    <button onclick="window.location.href='/admin/friendship-invitation'">
        Friendship Invitation
    </button>
    <button onclick="window.location.href='/admin/chat'">
        Chat
    </button>
    <button onclick="window.location.href='/admin/chat-membership'">
        Chat Membership
    </button>
    <button onclick="window.location.href='/admin/chat-invitation'">
        Chat Invitation
    </button>
    <button onclick="window.location.href='/admin/message'">
        Message
    </button>
    
    <h1>Admin Panel - Chat Management</h1>

    <form id="newChatForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <button type="button" id="createNewChat">Create Chat</button>
    </form>

    <table class="chat-table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>New Name</th>
            <th>Delete Chat</th>
        </tr>
        </thead>
        <tbody>
        {{range .Chats}}
        <tr>
            <td>{{.Id}}</td>
            <td>{{.Name}}</td>
            <td class="changeName">
                <form id="changeNameForm{{.Id}}">
                    <input type="text" id="newName" name="new_name" required>
            
                    <button type="button" id="changeName{{.Id}}">Change</button>
                </form>
            </td>
            <td class="delete">
                <button onclick="deleteChat({{.Id}})">Delete</button>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>


<script>
    function getFormDataAsJSON(formId) {
        const form = document.getElementById(formId);
        if (!form) {
            console.error(`Form with ID "${formId}" not found.`);
            return null;
        }

        const formData = new FormData(form);
        const formJSON = {};

        formData.forEach((value, key) => {
            formJSON[key] = value;
        });

        document.getElementById(formId).reset();

        return formJSON;
    }

    function sendJSON(endpoint, json) {
        fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(json)
        })
        .then(response => {            
            if (response.ok) {
                alert("JSON sent successfully!");
                location.reload()
            } else {
                return response.json().then(data => {
                    alert("Error: " + (data["error"] || "server troubles"));
                });
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while sending json.");
        });
    }

    document.getElementById("createNewChat").addEventListener("click", function(event) {
        event.preventDefault();
        
        const json = getFormDataAsJSON("newChatForm");
        sendJSON("/admin/chat/create", json);
    });

    {{range .Chats}}
        document.getElementById("changeName{{.Id}}").addEventListener("click", function(event) {
            event.preventDefault();

            const json = getFormDataAsJSON("changeNameForm{{.Id}}");
            json["id"] = {{.Id}};
            
            sendJSON("/admin/chat/change", json);
        });
    {{end}}

    function deleteChat(id) {
        if (confirm(`Are you sure you want to delete chat ${id}?`)) {
            fetch(`/admin/chat/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert(`Chat ${id} deleted successfully`);
                    location.reload();
                } else {
                    alert(`Failed to delete chat ${id}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(`An error occurred while deleting chat ${id}`);
            });
        }
    }
</script>

</body>
</html>
