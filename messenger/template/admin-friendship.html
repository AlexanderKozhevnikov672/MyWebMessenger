<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Friendships</title>
</head>
<body>

<div class="container">
    <button onclick="window.location.href='/admin/user'">
        User
    </button>
    <button onclick="window.location.href='/admin/friendship'">
        Friendship
    </button>
    <button onclick="window.location.href='/admin/friendship-invitation'">
        Friendship Invitation
    </button>
    <button onclick="window.location.href='/admin/chat'">
        Chat
    </button>
    <button onclick="window.location.href='/admin/chat-membership'">
        Chat Membership
    </button>
    <button onclick="window.location.href='/admin/chat-invitation'">
        Chat Invitation
    </button>
    <button onclick="window.location.href='/admin/message'">
        Message
    </button>
    
    <h1>Admin Panel - Friendship Management</h1>

    <form id="newFriendshipForm">
        <label for="userId1">First User Id:</label>
        <input type="text" id="userId1" name="user_id1" required><br><br>

        <label for="userId2">Second User Id:</label>
        <input type="text" id="userId2" name="user_id2" required><br><br>

        <button type="button" id="createNewFriendship">Create Friendship</button>
    </form>

    <table class="friendship-table">
        <thead>
        <tr>
            <th>First User Id</th>
            <th>Second User Id</th>
            <th>Delete Friendship</th>
        </tr>
        </thead>
        <tbody>
        {{range .Friendships}}
        <tr>
            <td>{{.UserId1}}</td>
            <td>{{.UserId2}}</td>
            <td class="delete">
                <button onclick="deleteFriendship(merge({{.UserId1}},{{.UserId2}}))">Delete</button>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>


<script>
    function merge(id1, id2) {
        return `${id1}-${id2}`
    }
    
    function getFormDataAsJSON(formId) {
        const form = document.getElementById(formId);
        if (!form) {
            console.error(`Form with ID "${formId}" not found.`);
            return null;
        }

        const formData = new FormData(form);
        const formJSON = {};

        formData.forEach((value, key) => {
            formJSON[key] = parseInt(value);
        });

        document.getElementById(formId).reset();

        return formJSON;
    }

    function sendJSON(endpoint, json) {
        fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(json)
        })
        .then(response => {            
            if (response.ok) {
                alert("JSON sent successfully!");
                location.reload()
            } else {
                return response.json().then(data => {
                    alert("Error: " + (data["error"] || "server troubles"));
                });
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while sending json.");
        });
    }

    document.getElementById("createNewFriendship").addEventListener("click", function(event) {
        event.preventDefault();
        
        const json = getFormDataAsJSON("newFriendshipForm");
        
        sendJSON("/admin/friendship/create", json);
    });

    function deleteFriendship(ids) {
        if (confirm(`Are you sure you want to delete friendship ${ids}?`)) {
            fetch(`/admin/friendship/delete/${ids}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert(`Friendship ${ids} deleted successfully`);
                    location.reload();
                } else {
                    alert(`Failed to delete friendship ${ids}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(`An error occurred while deleting friendship ${ids}`);
            });
        }
    }
</script>

</body>
</html>
